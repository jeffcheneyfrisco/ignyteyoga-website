[build]
  command = "pnpm build"
  publish = "dist"

# Node comes from NODE_VERSION (overrides the UI). pnpm comes from package.json "packageManager".
[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://widgets.mindbodyonline.com; frame-src 'self' https://widgets.mindbodyonline.com https://www.mindbodyonline.com https://clients.mindbodyonline.com https://*.mindbodyonline.com https://www.google.com https://maps.google.com; connect-src 'self' https://widgets.mindbodyonline.com https://*.mindbodyonline.com; form-action 'self'; base-uri 'self'; object-src 'none'"

# Schedule document plus the /book assets that app requests. The function fetches
# Mindbody and adds one teacher-name style to the schedule HTML. No external redirect:
# a status-200 proxy of another host is not used.
[[edge_functions]]
  function = "schedule-staff"
  pattern = "^/book/.*"

